[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "advanced-tts-mcp"
version = "1.0.0"
description = "Advanced TTS MCP Server - High-quality neural voice synthesis with enhanced features and streaming capabilities"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Sami Halawa", email = "sami@example.com"}
]
keywords = ["mcp", "tts", "text-to-speech", "kokoro", "neural-speech", "ai", "voice-synthesis"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "fastmcp>=0.9.0", 
    "kokoro-onnx>=0.4.0",
    "numpy>=1.24.0",
    "soundfile>=0.12.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "termcolor>=2.0.0",
    "anyio>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/samihalawa/advanced-tts-mcp"
Repository = "https://github.com/samihalawa/advanced-tts-mcp"
Issues = "https://github.com/samihalawa/advanced-tts-mcp/issues"
Documentation = "https://github.com/samihalawa/advanced-tts-mcp#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/advanced_tts"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.black]
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true